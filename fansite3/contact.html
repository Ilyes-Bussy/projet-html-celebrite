<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>JUL - Contact</title>
    <link rel="stylesheet" href="fansite3.css">
</head>

<body>
   <header>
    
        <section>
            <article class="haut-de-page">
                <h1>JUL FAN SITE</h1>
                <p>Bienvenue dans l'univers de JUL</p>
                <nav>
                    <a href="../index.html">Accueil</a>
                    <a href="fansite3.html">Fansite</a>
                    <a href="actualite.html">Actualitées</a>
                    <a href="evenement.html">Evénements</a>
                    <a href="photo.html">Photos</a>
                    
                    <a href="contact.html">Contact</a>
                </nav>
            </article>
        </section>
    
    </header>

    <main>

        <h2 class="title-contact">Contactez-nous</h2>

        <p class="txt-contact">
            Vous aimez JUL ?
            Envoyez-nous un message et partagez votre avis !
        </p>

        <form>

            <label for="nom">Votre nom :</label>
            <input type="text" id="nom" name="nom"
                placeholder="Entrez votre nom" required>

            <label for="email">Votre adresse e-mail :</label>
            <input type="email" id="email" name="email"
                placeholder="Entrez votre e-mail" required>

            <label for="message">Votre message :</label>
            <textarea id="message" name="message"
                    placeholder="Écrivez votre message"
                    rows="6" required></textarea>

            <button type="submit">Envoyer</button>

        </form>

    </main>

    <footer>
        <p>JUL Fan Site - 2026</p>
    </footer>

</body>
</html>
